<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora em Python</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    input, select, button { width: 100%; margin-bottom: 12px; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h2>Calculadora Simples</h2>
  
  <form method="POST" action="/calcular">
    <label>Primeiro Número:</label>
    <input type="number" step="any" name="num1" required placeholder="Ex: 10">

    <label>Operação:</label>
    <select name="op">
      <option value="+">+ Adição (Soma)</option>
      <option value="-">- Subtração</option>
      <option value="*">* Multiplicação</option>
      <option value="/">/ Divisão</option>
    </select>

    <label>Segundo Número:</label>
    <input type="number" step="any" name="num2" required placeholder="Ex: 5">

    <button type="submit">Calcular</button>
  </form>
</body>
</html>
