<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora 100% Python</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.4rem;
      margin-top: 1.2rem;
    }
    label:first-of-type { margin-top: 0; }
    input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 10px;
      color: #f8fafc;
      outline: none;
    }
    .grid-op {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
    .op-btn {
      padding: 0.75rem;
      font-size: 1.15rem;
      font-weight: bold;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 10px;
      color: #f1f5f9;
      cursor: pointer;
    }
    .op-btn.ativo {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    button.btn-calcular {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button.btn-calcular:hover { background: #0369a1; }
    .resultado-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border-radius: 10px;
      background: #030712;
      border: 1px solid #1f2937;
      text-align: center;
    }
    .resultado-valor {
      font-size: 1.5rem;
      font-weight: bold;
      color: #4ade80;
    }
    .erro-valor {
      font-size: 0.95rem;
      color: #f87171;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Calculadora Simples</h1>

  <div class="container">
    <form method="POST" action="/calcular">
      <label for="num1">Primeiro Número (num1):</label>
      <input type="number" step="any" id="num1" name="num1" required value="{{NUM1}}">

      <label>Operação Matemática:</label>
      <input type="hidden" id="opInput" name="op" value="{{OP}}">
      <div class="grid-op">
        <button type="button" class="op-btn {{OP_PLUS_CLASS}}" onclick="selecionarOp('+')">+</button>
        <button type="button" class="op-btn {{OP_MINUS_CLASS}}" onclick="selecionarOp('-')">-</button>
        <button type="button" class="op-btn {{OP_MULT_CLASS}}" onclick="selecionarOp('*')">*</button>
        <button type="button" class="op-btn {{OP_DIV_CLASS}}" onclick="selecionarOp('/')">/</button>
      </div>

      <label for="num2">Segundo Número (num2):</label>
      <input type="number" step="any" id="num2" name="num2" required value="{{NUM2}}">

      <button type="submit" class="btn-calcular">Calcular com Python</button>
    </form>

    {{BLOCO_RESULTADO}}
  </div>

  <script>
    function selecionarOp(simbolo) {
      document.getElementById('opInput').value = simbolo;
      document.querySelectorAll('.op-btn').forEach(function(b) {
        if (b.textContent.trim() === simbolo) {
          b.classList.add('ativo');
        } else {
          b.classList.remove('ativo');
        }
      });
    }
  </script>
</body>
</html>
