<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado do Cálculo - Python</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 2.25rem 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 1.2rem;
      color: #94a3b8;
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .resultado {
      font-size: 2rem;
      font-weight: 700;
      color: #38bdf8;
      margin: 1.5rem 0;
      padding: 1rem;
      background: #030712;
      border-radius: 8px;
      border: 1px solid #1f2937;
      font-mono: monospace;
    }
    .resultado.erro {
      color: #f87171;
      font-size: 1.25rem;
    }
    .detalhes {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1.75rem;
    }
    .detalhes strong {
      color: #cbd5e1;
    }
    a.btn-voltar {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s;
    }
    a.btn-voltar:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resultado da Operação</h1>
    
    <div class="resultado">
      {resultado}
    </div>

    <div class="detalhes">
      Operação realizada: <strong>{expressao}</strong>
    </div>

    <a href="/" class="btn-voltar">Fazer Outro Cálculo</a>
  </div>
</body>
</html>
